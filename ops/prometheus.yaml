apiVersion: v1
kind: ConfigMap
metadata: {name: demo-prometheus, namespace: cicd-observe}
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    rule_files: [/etc/prometheus/alerts.yml]
    scrape_configs:
      - job_name: demo
        static_configs:
          - targets: ['demo.cicd-demo.svc:80']
      - job_name: argocd
        static_configs:
          - targets: ['argocd-metrics.argocd.svc:8082']
  alerts.yml: |
    groups:
      - name: demo
        rules:
          - alert: DemoUnreachable
            expr: up{job="demo"} == 0
            for: 1m
            labels: {severity: warning}
            annotations: {summary: '业务 Service 无法抓取'}
          - alert: ArgoApplicationUnhealthy
            expr: argocd_app_info{name="cicd-demo",health_status!="Healthy"} == 1
            for: 3m
            labels: {severity: warning}
            annotations: {summary: 'Argo 应用不健康'}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: demo-prometheus, namespace: cicd-observe}
spec:
  replicas: 1
  selector:
    matchLabels: {app: demo-prometheus}
  template:
    metadata:
      labels: {app: demo-prometheus}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args: ['--config.file=/etc/prometheus/prometheus.yml','--storage.tsdb.path=/prometheus','--storage.tsdb.retention.time=24h','--storage.tsdb.retention.size=256MB']
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 250m, memory: 256Mi}
          ports: [{containerPort: 9090}]
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus}
            - {name: data, mountPath: /prometheus}
      volumes:
        - name: config
          configMap: {name: demo-prometheus}
        - name: data
          emptyDir: {sizeLimit: 300Mi}
