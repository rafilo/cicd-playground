apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cicd-azure
  namespace: argocd
spec:
  project: cicd-azure
  source:
    repoURL: https://github.com/rafilo/cicd-playground.git
    targetRevision: master
    path: k8s/base
    kustomize:
      namespace: cicd-azure
      images:
        - demo=docker.io/rafilo/test-devops@sha256:0402517132788a43149e2c1652d7056024778fd2ddc51a850d21c9ab8a96843a
      patches:
        - target:
            group: apps
            version: v1
            kind: Deployment
          patch: |-
            - op: add
              path: /spec/template/spec/imagePullSecrets
              value:
                - name: dockerhub-pull
  destination:
    server: https://kubernetes.default.svc
    namespace: cicd-azure
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
      allowEmpty: false
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
