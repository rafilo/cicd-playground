apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: cicd-azure
  namespace: argocd
spec:
  description: .NET demo on the existing AKS cluster
  sourceRepos:
    - https://github.com/rafilo/cicd-playground.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: cicd-azure
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: ""
      kind: Service
    - group: policy
      kind: PodDisruptionBudget
