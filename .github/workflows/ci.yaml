name: CI and image PR
on:
  pull_request:
  push:
    branches: [main]
    paths: ['app/**', 'test/**', 'Dockerfile', 'package.json', 'scripts/**', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm test && npm run validate
      - run: kubectl kustomize k8s/overlays/dev > /tmp/rendered.yaml
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions: {contents: write, packages: write, pull-requests: write}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          build-args: VERSION=${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - run: node scripts/update-image.js
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITOPS_PR_TOKEN }}
          branch: gitops/image-${{ github.sha }}
          title: 'deploy: image ${{ github.sha }}'
          commit-message: 'deploy: update immutable image digest'
          body: 'CI 已测试并发布镜像。请审查 digest，合并后 ArgoCD 自动同步。'
          add-paths: k8s/overlays/dev/kustomization.yaml
