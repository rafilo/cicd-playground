name: CI and image PR
on:
  pull_request:
  push:
    branches: [master]
    paths: ['app/**', 'test/**', 'Dockerfile', '.dockerignore', 'global.json', 'Directory.Build.props', 'Directory.Packages.props', 'NuGet.Config', 'package.json', 'scripts/**', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CACHE: ${{ github.workspace }}/.nuget/packages
jobs:
  test:
    name: .NET unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-dotnet-cache
        with:
          cache-path: ${{ env.CACHE }}
      - name: Run .NET unit tests
        run: dotnet test test/UnitTests/PodFlow.UnitTests.csproj -c Release --no-restore --logger "trx;LogFileName=unit-tests.trx" --results-directory TestResults
      - name: Upload .NET unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-unit-test-results
          path: TestResults/*.trx
          if-no-files-found: ignore
  integration:
    name: Start application and run HTTP integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-dotnet-cache
        with:
          cache-path: ${{ env.CACHE }}
      - run: dotnet build test/PodFlow.SmokeTests.csproj -c Release --no-restore
      - name: Start Kestrel and verify HTTP endpoints
        run: dotnet run --project test/PodFlow.SmokeTests.csproj -c Release --no-build
  configuration:
    name: Tooling and Kubernetes configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm test && npm run validate
      - run: node --check app/wwwroot/client.js
      - uses: ./.github/actions/setup-kubectl
      - run: kubectl kustomize k8s/overlays/dev > /tmp/rendered.yaml
      - run: kubectl kustomize k8s/overlays/prod > /tmp/production.yaml
  probes:
    name: Container security and real Pod probes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOCKER_BUILD_SUMMARY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build .NET runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: podflow:ci
          build-args: VERSION=${{ github.sha }}
      - name: Verify read-only non-root container
        run: bash scripts/verify-container.sh podflow:ci "$GITHUB_SHA"
      - uses: ./.github/actions/setup-kubectl
      - name: Verify Kubernetes readiness, liveness and metrics
        run: bash scripts/verify-pod-probes.sh podflow:ci "$GITHUB_SHA"
  publish:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: [test, integration, configuration, probes]
    runs-on: ubuntu-latest
    permissions: {contents: write, packages: write, pull-requests: write}
    env:
      DOCKER_BUILD_SUMMARY: 'true'
      PR_TOKEN: ${{ secrets.GITOPS_PR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: docker/setup-buildx-action@v3
      - id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          build-args: VERSION=${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - run: node scripts/update-image.js
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
      - if: env.PR_TOKEN != ''
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITOPS_PR_TOKEN }}
          branch: gitops/image-${{ github.sha }}
          title: 'deploy: image ${{ github.sha }}'
          commit-message: 'deploy: update immutable image digest'
          body: 'CI tested and published the image. Review the digest; ArgoCD syncs after merge.'
          add-paths: k8s/overlays/dev/kustomization.yaml
      - name: Publish review branch when PR token is unavailable
        if: env.PR_TOKEN == ''
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          branch="gitops/image-$SOURCE_SHA"
          git checkout -b "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/dev/kustomization.yaml
          git commit -m "deploy: update immutable image digest"
          git push origin "$branch"
          echo "Image published. A repository maintainer must create and review a PR from $branch. No direct deployment was performed." >> "$GITHUB_STEP_SUMMARY"
