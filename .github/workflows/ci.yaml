name: CI and image PR
on:
  pull_request:
  push:
    branches: [master]
    paths: ['app/**', 'test/**', 'Dockerfile', '.dockerignore', 'global.json', 'Directory.Build.props', 'Directory.Packages.props', 'NuGet.Config', 'package.json', 'scripts/**', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore cached NuGet packages
        id: nuget-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json', 'NuGet.Config', '**/*.csproj', '**/packages.lock.json', '**/Directory.Build.props', '**/Directory.Build.targets', '**/Directory.Packages.props') }}
      - name: Report NuGet cache result
        env:
          CACHE_HIT: ${{ steps.nuget-cache.outputs.cache-hit }}
        run: echo "NuGet cache exact hit=$CACHE_HIT; restore reuses packages from NUGET_PACKAGES."
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Restore locked dependencies (reuse cached packages)
        run: |
          dotnet restore test/UnitTests/PodFlow.UnitTests.csproj --configfile NuGet.Config --locked-mode
          dotnet restore test/PodFlow.SmokeTests.csproj --configfile NuGet.Config --locked-mode
      - name: Run .NET unit tests without another restore
        run: dotnet test test/UnitTests/PodFlow.UnitTests.csproj -c Release --no-restore --logger "trx;LogFileName=unit-tests.trx" --results-directory TestResults
      - name: Upload .NET unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-unit-test-results
          path: TestResults/*.trx
          if-no-files-found: ignore
      - run: dotnet build test/PodFlow.SmokeTests.csproj -c Release --no-restore
      - name: Run .NET HTTP integration checks
        run: dotnet run --project test/PodFlow.SmokeTests.csproj -c Release --no-build
      - run: npm test && npm run validate
      - run: node --check app/wwwroot/client.js
      - name: Install pinned kubectl
        shell: bash
        run: |
          curl -fsSLo /tmp/kubectl https://dl.k8s.io/release/v1.36.1/bin/linux/amd64/kubectl
          curl -fsSLo /tmp/kubectl.sha256 https://dl.k8s.io/release/v1.36.1/bin/linux/amd64/kubectl.sha256
          echo "$(cat /tmp/kubectl.sha256)  /tmp/kubectl" | sha256sum --check
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
      - run: kubectl kustomize k8s/overlays/dev > /tmp/rendered.yaml
      - run: kubectl kustomize k8s/overlays/prod > /tmp/production.yaml
      - uses: docker/setup-buildx-action@v3
      - name: Build .NET runtime image on every PR
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: podflow:ci
          build-args: VERSION=${{ github.sha }}
      - name: Verify read-only non-root container
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name podflow-ci --read-only --cap-drop ALL --security-opt no-new-privileges --user 1000:1000 -p 127.0.0.1:18081:8080 podflow:ci
          trap 'docker logs podflow-ci; docker rm -f podflow-ci' EXIT
          curl --retry 20 --retry-delay 1 --retry-connrefused --fail http://127.0.0.1:18081/readyz
          curl --fail http://127.0.0.1:18081/ | grep -q 'Traffic distribution'
          curl --fail http://127.0.0.1:18081/api/whoami | python3 -c 'import json,sys; body=json.load(sys.stdin); assert body["version"] == sys.argv[1]' "$GITHUB_SHA"
  publish:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions: {contents: write, packages: write, pull-requests: write}
    env:
      PR_TOKEN: ${{ secrets.GITOPS_PR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: docker/setup-buildx-action@v3
      - id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          build-args: VERSION=${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - run: node scripts/update-image.js
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
      - if: env.PR_TOKEN != ''
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITOPS_PR_TOKEN }}
          branch: gitops/image-${{ github.sha }}
          title: 'deploy: image ${{ github.sha }}'
          commit-message: 'deploy: update immutable image digest'
          body: 'CI tested and published the image. Review the digest; ArgoCD syncs after merge.'
          add-paths: k8s/overlays/dev/kustomization.yaml
      - name: Publish review branch when PR token is unavailable
        if: env.PR_TOKEN == ''
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          branch="gitops/image-$SOURCE_SHA"
          git checkout -b "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/dev/kustomization.yaml
          git commit -m "deploy: update immutable image digest"
          git push origin "$branch"
          echo "Image published. A repository maintainer must create and review a PR from $branch. No direct deployment was performed." >> "$GITHUB_STEP_SUMMARY"
