name: CI and image PR
on:
  pull_request:
  push:
    branches: [master]
    paths: ['app/**', 'test/**', 'Dockerfile', 'package.json', 'scripts/**', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm test && npm run validate
      - name: Install pinned kubectl
        shell: bash
        run: |
          curl -fsSLo /tmp/kubectl https://dl.k8s.io/release/v1.36.1/bin/linux/amd64/kubectl
          curl -fsSLo /tmp/kubectl.sha256 https://dl.k8s.io/release/v1.36.1/bin/linux/amd64/kubectl.sha256
          echo "$(cat /tmp/kubectl.sha256)  /tmp/kubectl" | sha256sum --check
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
      - run: kubectl kustomize k8s/overlays/dev > /tmp/rendered.yaml
      - run: kubectl kustomize k8s/overlays/prod > /tmp/production.yaml
  publish:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions: {contents: write, packages: write, pull-requests: write}
    env:
      PR_TOKEN: ${{ secrets.GITOPS_PR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          build-args: VERSION=${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - run: node scripts/update-image.js
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
      - if: env.PR_TOKEN != ''
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITOPS_PR_TOKEN }}
          branch: gitops/image-${{ github.sha }}
          title: 'deploy: image ${{ github.sha }}'
          commit-message: 'deploy: update immutable image digest'
          body: 'CI tested and published the image. Review the digest; ArgoCD syncs after merge.'
          add-paths: k8s/overlays/dev/kustomization.yaml
      - name: Publish review branch when PR token is unavailable
        if: env.PR_TOKEN == ''
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          branch="gitops/image-$SOURCE_SHA"
          git checkout -b "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/dev/kustomization.yaml
          git commit -m "deploy: update immutable image digest"
          git push origin "$branch"
          echo "Image published. A repository maintainer must create and review a PR from $branch. No direct deployment was performed." >> "$GITHUB_STEP_SUMMARY"
