name: CI and image PR
on:
  pull_request:
  push:
    branches: [master]
    paths: ['app/**', 'test/**', 'Dockerfile', '.dockerignore', 'global.json', 'Directory.Build.props', 'Directory.Packages.props', 'NuGet.Config', 'package.json', 'scripts/**', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CACHE: ${{ github.workspace }}/.nuget/packages
  TRIVY_VERSION: v0.76.1
jobs:
  # See docs/security-scanning.md for scope, release gates and remediation.
  security:
    name: Application dependency and secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Scan committed NuGet lockfiles and application files without executing PR code.
      - name: Scan application dependencies and secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: app
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: 'false'
          exit-code: '1'
          format: json
          output: trivy-app.json
          timeout: 10m
      - name: Upload application security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-app
          path: trivy-app.json
          if-no-files-found: warn
          retention-days: 14
  # Run isolated .NET unit tests; this job can run alongside integration and configuration.
  test:
    name: .NET unit tests
    runs-on: ubuntu-latest
    steps:
      # Check out the source revision that this workflow is validating.
      - uses: actions/checkout@v4
      # Install the pinned .NET SDK and restore locked dependencies through CACHE.
      - uses: ./.github/actions/setup-dotnet-cache
        with:
          cache-path: ${{ env.CACHE }}
      # Execute unit tests without restoring dependencies again.
      - name: Run .NET unit tests
        run: dotnet test test/UnitTests/PodFlow.UnitTests.csproj -c Release --no-restore --logger "trx;LogFileName=unit-tests.trx" --results-directory TestResults
      # Preserve available TRX reports even when unit tests fail.
      - name: Upload .NET unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-unit-test-results
          path: TestResults/*.trx
          if-no-files-found: ignore
  # Start real Kestrel instances and run HTTP integration checks independently.
  integration:
    name: Start application and run HTTP integration tests
    runs-on: ubuntu-latest
    steps:
      # Check out the source revision that this workflow is validating.
      - uses: actions/checkout@v4
      # Install the pinned .NET SDK and restore locked dependencies through CACHE.
      - uses: ./.github/actions/setup-dotnet-cache
        with:
          cache-path: ${{ env.CACHE }}
      # Compile the HTTP integration runner and its application dependency.
      - run: dotnet build test/PodFlow.SmokeTests.csproj -c Release --no-restore
      # Launch the application in the integration runner and verify its HTTP behavior.
      - name: Start Kestrel and verify HTTP endpoints
        run: dotnet run --project test/PodFlow.SmokeTests.csproj -c Release --no-build
  # Check repository tooling and render both Kubernetes environments independently.
  configuration:
    name: Tooling and Kubernetes configuration
    runs-on: ubuntu-latest
    steps:
      # Check out the source revision that this workflow is validating.
      - uses: actions/checkout@v4
      # Install Node.js for repository tooling and frontend checks.
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      # Test image-update tooling and enforce repository configuration contracts.
      - run: npm test && npm run validate
      # Check frontend JavaScript syntax without executing browser code.
      - run: node --check app/wwwroot/client.js
      # Install checksum-verified kubectl for manifest rendering or Pod verification.
      - uses: ./.github/actions/setup-kubectl
      # Render the development overlay without changing a cluster.
      - run: kubectl kustomize k8s/overlays/dev > /tmp/rendered.yaml
      # Render the production overlay without changing a cluster.
      - run: kubectl kustomize k8s/overlays/prod > /tmp/production.yaml
  # Build and probe the test image only after tests, configuration and source scanning succeed.
  probes:
    # GitHub Actions uses needs (rather than dependsOn) to gate job execution.
    needs: [test, integration, configuration, security]
    name: Container security and real Pod probes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOCKER_BUILD_SUMMARY: 'false'
    steps:
      # Check out the source revision that this workflow is validating.
      - uses: actions/checkout@v4
      # Initialize Docker Buildx for the image build in this job.
      - uses: docker/setup-buildx-action@v3
      # Build and load a local test image without pushing it to a registry.
      - name: Build .NET runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: podflow:ci
          build-args: VERSION=${{ github.sha }}
      # Block runtime checks and publication on vulnerable OS/.NET packages or image secrets.
      - name: Scan test container image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: podflow:ci
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: 'false'
          exit-code: '1'
          format: json
          output: trivy-image.json
          timeout: 10m
      - name: Upload test image security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-test-image
          path: trivy-image.json
          if-no-files-found: warn
          retention-days: 14
      # Start the test image with restricted permissions and verify HTTP behavior.
      - name: Verify read-only non-root container
        run: bash scripts/verify-container.sh podflow:ci "$GITHUB_SHA"
      # Install checksum-verified kubectl for manifest rendering or Pod verification.
      - uses: ./.github/actions/setup-kubectl
      # Run real Pod checks in an isolated kind cluster and clean it up afterward.
      - name: Verify Kubernetes readiness, liveness and metrics
        run: bash scripts/verify-pod-probes.sh podflow:ci "$GITHUB_SHA"
  # Publish the release image only after every validation job succeeds.
  publish:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: [test, integration, configuration, security, probes]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {contents: write, packages: write, pull-requests: write}
    env:
      DOCKER_BUILD_SUMMARY: 'true'
      PR_TOKEN: ${{ secrets.GITOPS_PR_TOKEN }}
    steps:
      # Check out the source revision that this workflow is validating.
      - uses: actions/checkout@v4
      # Install Node.js for repository tooling and frontend checks.
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      # Initialize Docker Buildx for the image build in this job.
      - uses: docker/setup-buildx-action@v3
      # Compute the lowercase GHCR image name and expose it as a step output.
      - id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      # Authenticate to GHCR with the scoped workflow token.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Build and push the release image and expose its immutable digest.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          build-args: VERSION=${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      # The release build may resolve a newer runtime base image than the test build.
      # Scan its exact registry digest before creating any GitOps deployment update.
      - name: Scan published release digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: 'false'
          exit-code: '1'
          format: json
          output: trivy-release.json
          timeout: 10m
      - name: Upload release image security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-release-image
          path: trivy-release.json
          if-no-files-found: warn
          retention-days: 14
      # Write the published image name and digest into the development overlay.
      - run: node scripts/update-image.js
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
      # Create a review PR when a dedicated GitOps PR credential is configured.
      - if: env.PR_TOKEN != ''
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITOPS_PR_TOKEN }}
          branch: gitops/image-${{ github.sha }}
          title: 'deploy: image ${{ github.sha }}'
          commit-message: 'deploy: update immutable image digest'
          body: 'CI tested and published the image. Review the digest; ArgoCD syncs after merge.'
          add-paths: k8s/overlays/dev/kustomization.yaml
      # Push a review branch and explain the manual PR step when no PR token exists.
      - name: Publish review branch when PR token is unavailable
        if: env.PR_TOKEN == ''
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          branch="gitops/image-$SOURCE_SHA"
          git checkout -b "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/dev/kustomization.yaml
          git commit -m "deploy: update immutable image digest"
          git push origin "$branch"
          echo "Image published. A repository maintainer must create and review a PR from $branch. No direct deployment was performed." >> "$GITHUB_STEP_SUMMARY"
